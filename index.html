<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>BigMike</title>
<meta name="description" content="Lifting plan and log">
<meta name="theme-color" content="#121712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BigMike">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#121712; --card:#1b221b; --card2:#232c23; --line:#2c372c; --track:#2f3a2f;
  --text:#eef3ea; --muted:#9aab98; --accent:#7ed38a; --accent-ink:#0f2412; --warn:#f2c46b; --danger:#ff8a8a;
  --r:18px;
  font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom));overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#app{max-width:560px;margin:0 auto;padding:12px 16px 24px}
h1{font-size:26px;margin:2px 0;letter-spacing:-.3px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:16px;margin:0 0 8px}
h4{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
p{line-height:1.45;margin:6px 0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11px}
.center{text-align:center} .center .frog{margin:0 auto;display:block}
.pad{padding:0 4px}
.row{display:flex;align-items:center} .row.between{justify-content:space-between} .row.gap{gap:12px} .row.wrap{flex-wrap:wrap} .row.top{align-items:flex-start}
.center-row{justify-content:center;margin-top:8px}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;border:1px solid var(--line)}
.card.note{background:#202a1f;border-color:#3b4d38}
.card.note h3{color:var(--warn)}
.hero{display:flex;gap:12px;align-items:center;margin:8px 0 4px}
.hero.simple{margin:8px 0 8px}
.pill{background:var(--card2);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap;display:inline-block}
.pill.soft{opacity:.7}
.btn{appearance:none;border:0;border-radius:14px;background:var(--card2);color:var(--text);font:inherit;font-weight:600;padding:12px 16px;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{white-space:nowrap;padding:8px 12px;font-size:14px;border-radius:12px}
.btn.wide{width:100%;margin-top:12px}
.btn.big{padding:18px;font-size:18px;border-radius:16px}
.btn.danger{color:var(--danger)}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:4px;cursor:pointer}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-weight:700;font-size:17px;flex:none}
.icon-btn.sm{width:34px;height:34px;font-size:15px}
.icon-btn:disabled{opacity:.25}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:8px -16px 0;padding-left:16px;padding-right:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 13px;font:inherit;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chip.tiny{padding:5px 10px;font-size:13px}
.exlist,.next,.plan,.plist,.wlist{list-style:none;margin:10px 0 0;padding:0}
.exlist li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.exlist li:last-child{border:0}
.other{margin-top:14px}
.dots{display:flex;gap:8px}
.dot{flex:1;height:10px;border-radius:5px;background:var(--track)}
.dot.on{background:var(--accent)}
.ring{position:relative;flex:none}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.bignum{font-size:26px}
/* workout */
.wk-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.ex h2{font-size:22px}
.last{margin-top:10px;font-size:15px}
.hint{margin-top:6px;font-size:14px;color:var(--muted);background:var(--card2);border-radius:12px;padding:9px 11px;line-height:1.4}
.warm{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sets{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.set{flex:1;min-width:64px;text-align:center;padding:9px 4px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font:inherit;font-size:14px;background:none}
.set.now{border:2px solid var(--accent);color:var(--text);font-weight:700}
.set.done{background:var(--accent);color:var(--accent-ink);border:0;font-weight:700}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.lbl{font-size:12px;color:var(--muted);margin:0 0 4px 4px;text-transform:uppercase;letter-spacing:.5px}
.stepper{display:flex;align-items:stretch;background:var(--card2);border-radius:14px;overflow:hidden;height:56px}
.sbtn{width:44px;border:0;background:transparent;color:var(--text);font-size:24px;font-weight:600;flex:none}
.sbtn:active{background:var(--line)}
.sval{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.sval input{width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:24px;font-weight:700;text-align:center;padding:0;outline:none}
.sval span{font-size:11px;color:var(--muted);margin-top:-2px}
.card .row .stepper{width:170px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.actions .btn{padding:10px 4px;font-size:13px}
.next li,.plan li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.next li:last-child,.plan li:last-child{border:0}
.next li.dim{opacity:.55}
.ok{color:var(--accent);font-weight:800;font-size:18px;padding:0 8px}
.mv{display:flex;gap:6px}
.rest{position:sticky;top:calc(env(safe-area-inset-top) + 6px);z-index:5;margin:6px 0}
.rest-in{display:flex;align-items:center;gap:10px;background:#243425;border:1px solid #3d5a3f;border-radius:16px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.rest-in.go{background:var(--accent);color:var(--accent-ink);justify-content:space-between;padding:14px 16px;font-size:18px;animation:pulse 1s ease-in-out infinite}
.rest-in.go .btn{background:var(--accent-ink);color:var(--accent)}
.rtime{font-size:24px;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{transform:scale(1.02)}}
body.flash::after{content:"";position:fixed;inset:0;background:var(--accent);pointer-events:none;animation:flash 1.6s ease-out;z-index:50}
@keyframes flash{0%,40%{opacity:.55}20%,60%{opacity:.1}100%{opacity:0}}
/* summary */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.tiles.four{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.tile b{display:block;font-size:24px}
.tile span{font-size:12px;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.rate button,.seg button{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:12px 0;font:inherit;font-weight:700;font-size:16px}
.rate button.on,.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:10px 0}
.seg.small{margin:0;grid-auto-columns:52px}
.seg.small button{padding:7px 0;font-size:14px}
/* plan + progress */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.mt{display:flex;justify-content:space-between;background:var(--card2);border-radius:10px;padding:8px 10px;font-size:14px;border-left:4px solid var(--track)}
.mt.good{border-left-color:var(--accent)} .mt.mid{border-left-color:var(--warn)} .mt.low{border-left-color:var(--danger)}
.mrow{display:grid;grid-template-columns:86px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.mrow b{text-align:right}
.mbar{position:relative;height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.mbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
.mbar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.5}
.chart{width:100%;height:auto;margin-top:8px;display:block}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .goal{stroke:var(--warn);stroke-dasharray:4 4;opacity:.8}
.chart .axis{fill:var(--muted);font-size:10px;font-family:inherit}
/* log */
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.qbtn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:14px;padding:10px;text-align:left;font:inherit;display:flex;flex-direction:column;gap:2px}
.qbtn b{font-size:16px;color:var(--accent)}
.qbtn span{font-size:12px;color:var(--muted)}
.plist li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.x{background:none;border:0;color:var(--muted);font-size:20px;padding:0 4px 0 10px;line-height:1}
.wlist li{padding:11px 0;border-bottom:1px solid var(--line)}
.wdetail{margin-top:8px;font-size:14px;display:flex;flex-direction:column;gap:6px}
/* setup + settings */
.setup{padding-top:16px}
.how{padding-left:18px;margin:0}.how li{margin:8px 0;line-height:1.4}
.big-in{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;font-size:22px;font-weight:700;padding:12px 14px;outline:none;min-width:0}
.unit{margin-left:10px;color:var(--muted)}
.toggle{width:52px;height:32px;border-radius:16px;border:0;background:var(--track);position:relative;flex:none}
.toggle i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--accent)} .toggle.on i{left:23px}
.card .row.between{margin:8px 0}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;pointer-events:none}
#sheet.open{pointer-events:auto}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .15s}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out;max-width:560px;margin:0 auto;-webkit-overflow-scrolling:touch}
.sheet-x{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--card2);color:var(--muted);font-size:22px;line-height:1}
.sheet-card h2{padding-right:40px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-card ol{padding-left:20px;margin:6px 0}.sheet-card ol li{margin:5px 0;line-height:1.4}
.muscles{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;font-size:15px;padding:12px 2px;text-align:left}
.check{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.energy{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.energy button{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:16px;padding:16px;text-align:left;font:inherit;display:flex;flex-direction:column;gap:3px}
.energy b{font-size:18px}.energy span{color:var(--muted);font-size:14px}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
@keyframes fade{from{opacity:0}}
/* tabs + toast */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(18,23,18,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tab{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#eef3ea;color:#152015;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs" hidden>
  <button class="tab" data-a="go" data-v="today"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Today</button>
  <button class="tab" data-a="go" data-v="plan"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Plan</button>
  <button class="tab" data-a="go" data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 4 3 5-7"/></svg>Progress</button>
  <button class="tab" data-a="go" data-v="log"><svg viewBox="0 0 24 24"><path d="M12 21c4.5-2.5 7-6 7-10a7 7 0 1 0-14 0c0 4 2.5 7.5 7 10z"/><path d="M12 8v5l3 2"/></svg>Log</button>
  <button class="tab" data-a="go" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>
<script src="program.js"></script>
<script src="app.js"></script>
</body>
</html>
